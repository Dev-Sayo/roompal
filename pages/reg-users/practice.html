  <body>
    <div class="dropdown-container">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search options..."
        autocomplete="off"
      />
      <div class="options-list" id="optionsList">
        <div class="option-item" data-value="apple">Apple</div>
        <div class="option-item" data-value="banana">Banana</div>
        <div class="option-item" data-value="cherry">Cherry</div>
        <div class="option-item" data-value="grape">Grape</div>
        <div class="option-item" data-value="orange">Orange</div>
        <div class="option-item" data-value="pear">Pear</div>
        <div class="option-item" data-value="strawberry">Strawberry</div>
        <div class="option-item" data-value="watermelon">Watermelon</div>
      </div>
    </div>

    <p id="selected"></p>

    <script>
      const searchInput = document.getElementById("searchInput");
      const optionsList = document.getElementById("optionsList");
      const options = document.querySelectorAll(".option-item");
      const selected = document.getElementById("selected");

      // Show dropdown when input is focused
      searchInput.addEventListener("focus", function () {
        optionsList.classList.add("show");
      });

      // Filter options as user types
      searchInput.addEventListener("input", function () {
        const searchTerm = this.value.toLowerCase();
        let hasVisibleOptions = false;

        options.forEach((option) => {
          const text = option.textContent.toLowerCase();
          if (text.includes(searchTerm)) {
            option.classList.remove("hidden");
            hasVisibleOptions = true;
          } else {
            option.classList.add("hidden");
          }
        });

        // Show/hide "no results" message
        let noResults = optionsList.querySelector(".no-results");
        if (!hasVisibleOptions) {
          if (!noResults) {
            noResults = document.createElement("div");
            noResults.className = "no-results";
            noResults.textContent = "No results found";
            optionsList.appendChild(noResults);
          }
        } else {
          if (noResults) {
            noResults.remove();
          }
        }
      });

      // Handle option selection
      options.forEach((option) => {
        option.addEventListener("click", function () {
          const value = this.getAttribute("data-value");
          const text = this.textContent;

          searchInput.value = text;
          selected.textContent = `Selected: ${text} (${value})`;
          optionsList.classList.remove("show");

          console.log("Selected:", value);

        const visibleOptions = Array.from(options).filter(
          (opt) => !opt.classList.contains("hidden"),
        );

          e.preventDefault();
          visibleOptions[0].focus();
        }
      });
    </script>
