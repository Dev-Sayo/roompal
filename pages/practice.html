<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Filter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .filter-container {
        width: 100%;
        max-width: 320px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 20px;
      }

      .filter-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e5e7eb;
      }

      .filter-icon {
        width: 24px;
        height: 24px;
        background: #7c3aed;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .filter-icon svg {
        width: 16px;
        height: 16px;
        fill: white;
      }

      .filter-title {
        color: #7c3aed;
        font-weight: 600;
        font-size: 18px;
      }

      .filter-sections {
        margin-bottom: 20px;
      }

      .filter-section {
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 8px;
        margin-bottom: 8px;
      }

      .section-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 8px;
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        font-size: 15px;
        font-weight: 500;
        color: #1f2937;
        transition: background-color 0.2s;
      }

      .section-header:hover {
        background-color: #f9fafb;
        border-radius: 6px;
      }

      .section-arrow {
        width: 20px;
        height: 20px;
        transition: transform 0.3s;
        color: #6b7280;
      }

      .section-header.active .section-arrow {
        transform: rotate(180deg);
      }

      .section-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
        background: #f9fafb;
        border-radius: 6px;
        margin-top: 4px;
      }

      .section-content.active {
        max-height: 400px;
        padding: 8px;
      }

      .checkbox-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.2s;
      }

      .checkbox-option:hover {
        background-color: #f3f4f6;
      }

      .checkbox-option input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #7c3aed;
      }

      .checkbox-option label {
        font-size: 14px;
        color: #374151;
        cursor: pointer;
        flex: 1;
      }

      .filter-count {
        display: none;
        justify-content: center;
        margin: 16px 0;
      }

      .filter-count.active {
        display: flex;
      }

      .count-badge {
        background: #f97316;
        color: white;
        padding: 6px 16px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
      }

      .filter-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      .btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 25px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-reset {
        background: #d1d5db;
        color: #374151;
      }

      .btn-reset:hover {
        background: #9ca3af;
      }

      .btn-filter {
        background: #1e293b;
        color: white;
      }

      .btn-filter:hover {
        background: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="filter-container">
      <div class="filter-header">
        <div class="filter-icon">
          <svg viewBox="0 0 20 20">
            <path
              d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"
            />
          </svg>
        </div>
        <span class="filter-title">Component 68</span>
      </div>

      <div class="filter-sections" id="filterSections"></div>

      <div class="filter-count" id="filterCount">
        <div class="count-badge" id="countBadge">0</div>
      </div>

      <div class="filter-actions">
        <button class="btn btn-reset" id="resetBtn">Clear</button>
        <button class="btn btn-filter" id="filterBtn">Filter</button>
      </div>
    </div>

    <script>
      const filterOptions = {
        "Property type": [
          "Apartment",
          "House",
          "Condo",
          "Studio",
          "Villa",
          "Townhouse",
        ],
        "Rent Price, Yearly, N": [
          "Under $1000",
          "$1000 - $2000",
          "$2000 - $3000",
          "$3000 - $5000",
          "Over $5000",
        ],
        Agent: ["Agent A", "Agent B", "Agent C", "Agent D", "Independent"],
        Amenities: [
          "Swimming Pool",
          "Gym",
          "Parking",
          "Security",
          "Garden",
          "Elevator",
        ],
        Bathrooms: ["1", "2", "3", "4", "5+"],
        Bedrooms: ["Studio", "1", "2", "3", "4", "5+"],
        Furnishing: ["Fully Furnished", "Semi Furnished", "Unfurnished"],
      };

      let selectedFilters = {};

      function initializeFilters() {
        Object.keys(filterOptions).forEach((category) => {
          selectedFilters[category] = [];
        });
      }

      function createFilterSection(category, options) {
        const section = document.createElement("div");
        section.className = "filter-section";

        const header = document.createElement("button");
        header.className = "section-header";
        header.innerHTML = `
                <span>${category}</span>
                <svg class="section-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            `;

        const content = document.createElement("div");
        content.className = "section-content";

        options.forEach((option) => {
          const optionDiv = document.createElement("div");
          optionDiv.className = "checkbox-option";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = `${category}-${option}`;
          checkbox.value = option;

          const label = document.createElement("label");
          label.htmlFor = `${category}-${option}`;
          label.textContent = option;

          checkbox.addEventListener("change", (e) => {
            handleCheckboxChange(category, option, e.target.checked);
          });

          optionDiv.appendChild(checkbox);
          optionDiv.appendChild(label);
          optionDiv.addEventListener("click", (e) => {
            if (e.target !== checkbox) {
              checkbox.checked = !checkbox.checked;
              handleCheckboxChange(category, option, checkbox.checked);
            }
          });

          content.appendChild(optionDiv);
        });

        header.addEventListener("click", () => {
          header.classList.toggle("active");
          content.classList.toggle("active");
        });

        section.appendChild(header);
        section.appendChild(content);

        return section;
      }

      function handleCheckboxChange(category, option, isChecked) {
        if (isChecked) {
          if (!selectedFilters[category].includes(option)) {
            selectedFilters[category].push(option);
          }
        } else {
          selectedFilters[category] = selectedFilters[category].filter(
            (item) => item !== option,
          );
        }
        updateFilterCount();
      }

      function updateFilterCount() {
        const count = Object.values(selectedFilters).flat().length;
        const filterCountDiv = document.getElementById("filterCount");
        const countBadge = document.getElementById("countBadge");

        countBadge.textContent = count;

        if (count > 0) {
          filterCountDiv.classList.add("active");
        } else {
          filterCountDiv.classList.remove("active");
        }
      }

      function resetFilters() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
          checkbox.checked = false;
        });

        Object.keys(selectedFilters).forEach((category) => {
          selectedFilters[category] = [];
        });

        updateFilterCount();
      }

      function applyFilters() {
        console.log("Applied filters:", selectedFilters);

        const filterSummary = Object.entries(selectedFilters)
          .filter(([_, values]) => values.length > 0)
          .map(([category, values]) => `${category}: ${values.join(", ")}`)
          .join("\n");

        if (filterSummary) {
          alert("Filters applied!\n\n" + filterSummary);
        } else {
          alert("No filters selected");
        }
      }

      function init() {
        initializeFilters();

        const sectionsContainer = document.getElementById("filterSections");

        Object.entries(filterOptions).forEach(([category, options]) => {
          const section = createFilterSection(category, options);
          sectionsContainer.appendChild(section);
        });

        document
          .getElementById("resetBtn")
          .addEventListener("click", resetFilters);
        document
          .getElementById("filterBtn")
          .addEventListener("click", applyFilters);
      }

      init();
    </script>
  </body>
</html>
